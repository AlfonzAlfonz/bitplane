[package]
name = "bitplane-cli"
description = "bp — the bitplane command-line interface, rendering the machine contract for humans."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# ADR-0001: bitplane is deliberately not published to crates.io. Saying so here
# means an accidental `cargo publish` is refused rather than regretted.
publish = false

# `publish = false` is otherwise enough to hide this crate from dist, and the
# binary it would ship with it.
[package.metadata.dist]
dist = true

[[bin]]
name = "bp"
path = "src/main.rs"

[dependencies]
bitplane-core.workspace = true
clap.workspace = true
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
toml_edit.workspace = true
