[workspace]
resolver = "3"
members = ["crates/bitplane-core", "crates/bitplane-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["Denis Homolík"]
repository = "https://github.com/AlfonzAlfonz/bitplane"
homepage = "https://alfonzalfonz.github.io/bitplane/"

[workspace.dependencies]
bitplane-core = { path = "crates/bitplane-core" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# What `dist` builds a release with. It inherits `release` and overrides
# nothing: an artefact somebody downloads should be the binary that
# `cargo build --release` produces here, not a near relative of it.
[profile.dist]
inherits = "release"
