# Release plumbing, generated from here by `dist` (formerly cargo-dist).
#
# One config produces the whole channel set ADR-0001 committed to: per-target
# archives on a GitHub Release, the `curl | sh` installer, and the npm wrapper.
# `.github/workflows/release.yml` is generated from this file and must never be
# hand-edited — `dist generate` rewrites it, and CI checks that it is in sync.
#
# One thing here is **not** what ADR-0001 described. The ADR specified the npm
# wrapper as "per-platform `optionalDependencies` (the esbuild / swc / Biome
# pattern)". dist does not implement that pattern and offers no setting for it:
# its npm package is a single package that fetches the right archive from the
# release in a `postinstall` script. The outcome a user sees is the same — one
# binary, nothing compiled — but it needs network access and runs scripts at
# install time, so `npm install --ignore-scripts` and an offline mirror do not
# work. See `website/docs/install.md`, which documents what actually ships.

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# The installers to generate for each app
installers = ["shell"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = false
# The npm package should have this name
npm-package = "bitplane"
# Which actions to run on pull requests
pr-run-mode = "upload"
